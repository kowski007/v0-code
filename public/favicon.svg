<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="favGradient" cx="35%" cy="35%">
      <stop offset="0%" stopColor="#60a5fa" />
      <stop offset="50%" stopColor="#06b6d4" />
      <stop offset="100%" stopColor="#a78bfa" />
    </radialGradient>
    <filter id="favGlow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur" />
      <feMerge>
        <feMergeNode in="coloredBlur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" fill="#ffffff" rx="20" />
  <circle cx="50" cy="50" r="40" fill="url(#favGradient)" filter="url(#favGlow)" />
  <circle cx="35" cy="35" r="12" fill="white" opacity="0.4" />
  <circle cx="50" cy="50" r="40" fill="none" stroke="white" strokeWidth="0.8" opacity="0.3" />
</svg>
